@'
name: Gaming News Generator

on:
  workflow_dispatch:

  schedule:
    # 05:15 a. m. Perú (UTC-5)
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: gaming-news-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: America/Lima
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright google-api-python-client google-auth google-auth-oauthlib

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Preparar Google Drive
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("GOOGLE_TOKEN_JSON", "").strip()

          if not token:
              raise RuntimeError("GOOGLE_TOKEN_JSON no está disponible.")

          Path("token.json").write_text(token, encoding="utf-8")

          print("Autorización de Google Drive preparada.")
          PY

      - name: Comprobar configuración
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          openai_ok = bool(os.environ.get("OPENAI_API_KEY"))
          drive_ok = Path("token.json").exists()

          print("OpenAI disponible:", openai_ok)
          print("Google Drive disponible:", drive_ok)

          if not openai_ok:
              raise RuntimeError("Falta OPENAI_API_KEY")

          if not drive_ok:
              raise RuntimeError("Falta token.json")
          PY

      - name: Ejecutar Gaming News Generator
        run: |
          python daily_pipeline.py

      - name: Guardar contador de gasto API
        if: always()
        run: |
          if [ -f data/api_usage.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f data/api_usage.json

            if ! git diff --cached --quiet; then
              git commit -m "Update API usage [skip ci]"
              git push
            else
              echo "No hubo cambios en api_usage.json."
            fi
          fi
'@ | Set-Content ".github\workflows\daily-news.yml" -Encoding UTF8