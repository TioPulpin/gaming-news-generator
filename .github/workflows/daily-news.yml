name: Gaming News Generator

on:
  workflow_dispatch:

  schedule:
    # 05:15 a. m. Perú (UTC-5)
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: gaming-news-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: America/Lima
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DRIVE_WEBAPP_URL: ${{ secrets.DRIVE_WEBAPP_URL }}
      UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Comprobar configuración
        run: |
          python - <<'PY'
          import os

          checks = {
              "OPENAI_API_KEY": bool(os.environ.get("OPENAI_API_KEY")),
              "DRIVE_WEBAPP_URL": bool(os.environ.get("DRIVE_WEBAPP_URL")),
              "UPLOAD_SECRET": bool(os.environ.get("UPLOAD_SECRET")),
          }

          for name, ok in checks.items():
              print(f"{name}: {'OK' if ok else 'FALTA'}")

          if not all(checks.values()):
              raise RuntimeError("Faltan secretos requeridos.")
          PY

      - name: Ejecutar Gaming News Generator
        run: |
          python daily_pipeline.py

      - name: Guardar estado persistente
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/api_usage.json ]; then
            git add -f data/api_usage.json
          fi

          if [ -f data/published_history.json ]; then
            git add -f data/published_history.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update persistent state [skip ci]"
            git push
          else
            echo "Sin cambios persistentes."
          fi