<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1.0">
  <title>Gaming News Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="card">
    <header class="topbar">
      <div class="brand">
        <div class="avatar">
          <img id="avatar-image" alt="Avatar">
          <div id="avatar-fallback">NH</div>
        </div>
        <div class="name">Nicolas Hernandez</div>
      </div>
      <div class="slashes">///</div>
    </header>

    <div class="meta-row">
  <div class="number" id="number">01</div>
  <div class="news-date" id="news-date">31 AGO 2026</div>
</div>

<div class="category" id="category">INDUSTRIA</div>

<h1 class="headline" id="headline">
  TITULAR DE PRUEBA
</h1>

<section class="image-wrap">

  <img id="main-image" alt="Imagen principal">

  <div class="image-placeholder" id="image-placeholder">
    IMAGEN DE PRUEBA
  </div>

  <div class="image-fade top"></div>
  <div class="image-fade bottom"></div>

  <div class="image-source" id="image-source"></div>

</section>

    <section class="summary-box">
      <div class="summary-accent"></div>
      <p id="summary">
        Este es un resumen de prueba para validar la plantilla automática.
      </p>
    </section>

    <div class="dots"></div>
    <div class="bottom-line"></div>
    <div class="bottom-stripes">///</div>
  </div>
</body>
</html>
